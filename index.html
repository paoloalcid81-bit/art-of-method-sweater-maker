<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Art of Method Sweater Maker</title>
<style>
  :root {
    --bg: #f5f5f3;
    --panel: #ffffff;
    --ink: #171717;
    --muted: #6d6d6d;
    --line: #dedede;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 20px;
  }
  .stage, .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .stage {
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .brand h1 {
    font-size: 16px;
    margin: 0;
    letter-spacing: .08em;
  }
  .brand small { color: var(--muted); }
  .canvasWrap {
    flex: 1;
    display: grid;
    place-items: center;
    background: #e8e8e6;
    border-radius: 12px;
    overflow: hidden;
  }
  canvas {
    width: min(100%, 650px);
    aspect-ratio: 1/1;
    touch-action: none;
    display: block;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  .hint {
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  .controls {
    padding: 20px;
    height: max-content;
    position: sticky;
    top: 20px;
  }
  .section {
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .section:first-child { border-top: 0; padding-top: 0; }
  .section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    margin: 0 0 10px;
    color: var(--muted);
  }
  label {
    display: block;
    font-size: 12px;
    margin: 10px 0 6px;
    font-weight: 500;
  }
  input[type=text], select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    background: #fff;
    font: inherit;
  }
  input[type=range] { width: 100%; }
  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #fff;
    outline: 1px solid #cfcfcf;
    cursor: pointer;
  }
  .swatch.active { outline: 2px solid var(--ink); }
  .btn {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 11px 14px;
    cursor: pointer;
    background: #ececec;
    color: #111;
    font-weight: 600;
  }
  .btn.primary {
    background: #111;
    color: #fff;
  }
  .actions { display: grid; gap: 8px; }
  .checkline {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    margin-top: 10px;
  }
  @media(max-width: 880px) {
    .app { grid-template-columns: 1fr; }
    .controls { position: static; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="brand">
      <div>
        <h1>ART OF METHOD</h1>
        <small>Filipino-Inspired City Sweater Maker</small>
      </div>
      <small id="status">Ready</small>
    </div>

    <div class="canvasWrap">
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>
    <div class="hint">Drag text directly on the canvas to reposition.</div>
  </section>

  <aside class="controls">
    <div class="section">
      <h2>Garment</h2>
      <label>Garment Color</label>
      <div class="swatches" id="garmentSwatches"></div>
    </div>

    <div class="section">
      <h2>Primary Text</h2>
      <label>City / Word</label>
      <input id="mainText" type="text" value="EDMONTON" maxlength="24" />

      <label>Typography</label>
      <select id="fontStyle">
        <option value="jeepney">Jeepney / Display</option>
        <option value="bold">Bold Sans</option>
        <option value="classic">Classic Serif</option>
      </select>

      <label>Size</label>
      <input id="mainSize" type="range" min="40" max="140" value="95" />

      <label>Ink Color</label>
      <div class="swatches" id="mainSwatches"></div>

      <label class="checkline"><input id="outlineToggle" type="checkbox" checked /> Outline</label>
    </div>

    <div class="section">
      <h2>Secondary Text</h2>
      <label>Subtitle</label>
      <input id="subText" type="text" value="CANADA" maxlength="28" />

      <label>Size</label>
      <input id="subSize" type="range" min="20" max="70" value="36" />

      <label>Ink Color</label>
      <div class="swatches" id="subSwatches"></div>
    </div>

    <div class="section">
      <h2>Accent</h2>
      <label class="checkline"><input id="sunToggle" type="checkbox" checked /> Philippine Sun &amp; Stars</label>
      <label>Accent Size</label>
      <input id="accentSize" type="range" min="30" max="90" value="58" />
    </div>

    <div class="section actions">
      <button id="centerBtn" class="btn">Center Elements</button>
      <button id="resetBtn" class="btn">Reset Default</button>
      <button id="exportBtn" class="btn primary">Export Image (PNG)</button>
    </div>
  </aside>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const garmentColors = [
  ['Navy', '#172033'],
  ['Black', '#1a1a1a'],
  ['Cream', '#ece5d7'],
  ['Heather', '#8e9297'],
  ['Forest', '#243b2d'],
  ['Maroon', '#5a2530']
];

const inkColors = [
  ['Cream', '#f5ead6'],
  ['White', '#ffffff'],
  ['Gold', '#d4a94f'],
  ['Red', '#b53a32'],
  ['Blue', '#2f5da8'],
  ['Black', '#111111']
];

let state = {
  garmentColor: '#172033',
  mainText: 'EDMONTON',
  subText: 'CANADA',
  fontStyle: 'jeepney',
  mainSize: 95,
  subSize: 36,
  mainColor: '#f5ead6',
  subColor: '#f5ead6',
  outline: true,
  accent: true,
  accentSize: 58,
  mainPos: { x: 540, y: 490 },
  subPos: { x: 540, y: 565 },
  selected: null
};

const sweaterImage = new Image();
sweaterImage.src = 'black-ctft.png';
sweaterImage.onload = () => draw();

function createSwatches(elId, colors, stateKey) {
  const el = document.getElementById(elId);
  colors.forEach(([name, value]) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (state[stateKey] === value ? ' active' : '');
    b.style.background = value;
    b.title = name;
    b.dataset.value = value;
    b.addEventListener('click', () => {
      state[stateKey] = value;
      [...el.children].forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      draw();
    });
    el.appendChild(b);
  });
}

createSwatches('garmentSwatches', garmentColors, 'garmentColor');
createSwatches('mainSwatches', inkColors, 'mainColor');
createSwatches('subSwatches', inkColors, 'subColor');

function drawGarmentFallback() {
  ctx.save();
  ctx.fillStyle = state.garmentColor;
  ctx.beginPath();
  // Body silhouette
  ctx.moveTo(320, 260);
  ctx.lineTo(200, 420);
  ctx.lineTo(270, 470);
  ctx.lineTo(330, 390);
  ctx.lineTo(330, 840);
  ctx.lineTo(750, 840);
  ctx.lineTo(750, 390);
  ctx.lineTo(810, 470);
  ctx.lineTo(880, 420);
  ctx.lineTo(760, 260);
  ctx.quadraticCurveTo(540, 330, 320, 260);
  ctx.fill();
  ctx.restore();
}

function drawGarment() {
  if (!sweaterImage.complete || !sweaterImage.naturalWidth) {
    drawGarmentFallback();
    return;
  }
  const ratio = Math.min(960 / sweaterImage.naturalWidth, 960 / sweaterImage.naturalHeight);
  const width = sweaterImage.naturalWidth * ratio;
  const height = sweaterImage.naturalHeight * ratio;
  const x = (canvas.width - width) / 2;
  const y = (canvas.height - height) / 2;

  ctx.drawImage(sweaterImage, x, y, width, height);
}

function getFont(style, size) {
  if (style === 'classic') return `700 ${size}px Georgia, serif`;
  if (style === 'bold') return `900 ${size}px 'Arial Black', Arial, sans-serif`;
  return `900 ${size}px Impact, Haettenschweiler, sans-serif`;
}

function drawSunStars() {
  if (!state.accent) return;
  const s = state.accentSize;
  const cx = state.mainPos.x;
  const cy = state.mainPos.y - (state.mainSize * 0.7 + s * 0.7);

  ctx.save();
  ctx.fillStyle = state.mainColor;
  ctx.strokeStyle = state.mainColor;
  ctx.lineWidth = Math.max(3, s * 0.08);

  // Central Sun
  ctx.beginPath();
  ctx.arc(cx, cy, s * 0.28, 0, Math.PI * 2);
  ctx.fill();

  // Rays
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    const r1 = s * 0.38, r2 = s * 0.62;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    ctx.stroke();
  }

  // 3 Stars
  drawStar(cx - s * 1.15, cy, 5, s * 0.18, s * 0.08);
  drawStar(cx + s * 1.15, cy, 5, s * 0.18, s * 0.08);
  drawStar(cx, cy + s * 0.95, 5, s * 0.18, s * 0.08);
  ctx.restore();
}

function drawStar(cx, cy, spikes, outer, inner) {
  let rot = (Math.PI / 2) * 3;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
    rot += step;
  }
  ctx.closePath();
  ctx.fill();
}

function drawTextItem(text, pos, size, color, isMain) {
  if (!text) return;
  ctx.save();
  ctx.font = isMain ? getFont(state.fontStyle, size) : `800 ${size}px Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (isMain && state.outline) {
    ctx.lineWidth = Math.max(3, size * 0.08);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.strokeText(text, pos.x, pos.y);
  }

  ctx.fillStyle = color;
  ctx.fillText(text, pos.x, pos.y);

  if (state.selected === (isMain ? 'main' : 'sub')) {
    const m = ctx.measureText(text);
    const w = m.width + 24;
    const h = size + 16;
    ctx.strokeStyle = 'rgba(30, 120, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(pos.x - w / 2, pos.y - h / 2, w, h);
  }
  ctx.restore();
}

function drawWatermark() {
  ctx.save();
  ctx.font = '700 22px Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(20,20,20,0.45)';
  ctx.fillText('Art of Method Customizer', 1040, 1045);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, 1080, 1080);
  ctx.fillStyle = '#f5f5f3';
  ctx.fillRect(0, 0, 1080, 1080);

  drawGarment();
  drawSunStars();
  drawTextItem(state.mainText, state.mainPos, state.mainSize, state.mainColor, true);
  drawTextItem(state.subText, state.subPos, state.subSize, state.subColor, false);
}

function getTextBounds(text, pos, size, fontStyle, isMain) {
  ctx.save();
  ctx.font = isMain ? getFont(fontStyle, size) : `800 ${size}px Arial, sans-serif`;
  const metrics = ctx.measureText(text);
  ctx.restore();
  return {
    left: pos.x - metrics.width / 2 - 12,
    right: pos.x + metrics.width / 2 + 12,
    top: pos.y - size / 2 - 8,
    bottom: pos.y + size / 2 + 8
  };
}

function getPointer(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

let dragging = false, dragKey = null, dragOffset = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', e => {
  const p = getPointer(e);
  const mainB = getTextBounds(state.mainText, state.mainPos, state.mainSize, state.fontStyle, true);
  const subB = getTextBounds(state.subText, state.subPos, state.subSize, state.fontStyle, false);

  if (p.x >= mainB.left && p.x <= mainB.right && p.y >= mainB.top && p.y <= mainB.bottom) {
    dragKey = 'main';
  } else if (p.x >= subB.left && p.x <= subB.right && p.y >= subB.top && p.y <= subB.bottom) {
    dragKey = 'sub';
  } else {
    state.selected = null;
    draw();
    return;
  }

  state.selected = dragKey;
  const target = dragKey === 'main' ? state.mainPos : state.subPos;
  dragOffset = { x: p.x - target.x, y: p.y - target.y };
  dragging = true;
  canvas.setPointerCapture(e.pointerId);
  draw();
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = getPointer(e);
  const pos = dragKey === 'main' ? state.mainPos : state.subPos;
  pos.x = Math.max(200, Math.min(880, p.x - dragOffset.x));
  pos.y = Math.max(260, Math.min(840, p.y - dragOffset.y));
  draw();
});

canvas.addEventListener('pointerup', e => {
  dragging = false;
  dragKey = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});

function bind(id, evt, fn) {
  document.getElementById(id).addEventListener(evt, fn);
}

bind('mainText', 'input', e => { state.mainText = e.target.value.toUpperCase(); draw(); });
bind('subText', 'input', e => { state.subText = e.target.value.toUpperCase(); draw(); });
bind('fontStyle', 'change', e => { state.fontStyle = e.target.value; draw(); });
bind('mainSize', 'input', e => { state.mainSize = +e.target.value; draw(); });
bind('subSize', 'input', e => { state.subSize = +e.target.value; draw(); });
bind('accentSize', 'input', e => { state.accentSize = +e.target.value; draw(); });
bind('outlineToggle', 'change', e => { state.outline = e.target.checked; draw(); });
bind('sunToggle', 'change', e => { state.accent = e.target.checked; draw(); });

bind('centerBtn', 'click', () => {
  state.mainPos = { x: 540, y: 490 };
  state.subPos = { x: 540, y: 565 };
  draw();
});

bind('resetBtn', 'click', () => {
  state.mainText = 'EDMONTON';
  state.subText = 'CANADA';
  state.fontStyle = 'jeepney';
  state.mainSize = 95;
  state.subSize = 36;
  state.mainColor = '#f5ead6';
  state.subColor = '#f5ead6';
  state.outline = true;
  state.accent = true;
  state.accentSize = 58;
  state.mainPos = { x: 540, y: 490 };
  state.subPos = { x: 540, y: 565 };
  state.selected = null;

  document.getElementById('mainText').value = 'EDMONTON';
  document.getElementById('subText').value = 'CANADA';
  document.getElementById('fontStyle').value = 'jeepney';
  document.getElementById('mainSize').value = 95;
  document.getElementById('subSize').value = 36;
  document.getElementById('accentSize').value = 58;
  document.getElementById('outlineToggle').checked = true;
  document.getElementById('sunToggle').checked = true;
  draw();
});

bind('exportBtn', 'click', () => {
  const prevSelected = state.selected;
  state.selected = null;
  draw();
  drawWatermark();
  const link = document.createElement('a');
  link.download = `art-of-method-${state.mainText.toLowerCase() || 'design'}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  state.selected = prevSelected;
  draw();
});

draw();
</script>
</body>
</html>
