<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Art of Method Sweater Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f3;
    --panel: #ffffff;
    --ink: #171717;
    --muted: #6d6d6d;
    --line: #dedede;
    --accent: #171717;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    max-width: 1240px;
    margin: auto;
    padding: 18px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 18px;
  }
  .stage, .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
  }
  .stage {
    min-height: 760px;
    padding: 18px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    margin-bottom: 12px;
  }
  .brand h1 {
    font-size: 18px;
    margin: 0 0 4px;
    letter-spacing: .08em;
  }
  .brand small { color: var(--muted); }
  .canvasWrap {
    flex: 1;
    display: grid;
    place-items: center;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  canvas {
    width: min(100%, 740px);
    aspect-ratio: 1/1;
    touch-action: none;
    display: block;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  .hint {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  .controls {
    padding: 16px;
    height: max-content;
    position: sticky;
    top: 12px;
  }
  .section {
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .section:first-child { border-top: 0; padding-top: 0; }
  .section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .13em;
    margin: 0 0 10px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 6px;
  }
  input, select, button {
    font: inherit;
  }
  input[type=text], select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 11px;
    background: #fff;
  }
  input[type=range] { width: 100%; }
  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #fff;
    outline: 1px solid #cfcfcf;
    cursor: pointer;
  }
  .swatch.active { outline: 3px solid #111; }
  .btn {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 11px 12px;
    cursor: pointer;
    background: #ececec;
    color: #111;
    font-weight: 700;
  }
  .btn.primary {
    background: #111;
    color: #fff;
  }
  .actions { display: grid; gap: 8px; }
  .checkline {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .tiny {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  @media(max-width: 880px) {
    .app { grid-template-columns: 1fr; }
    .controls { position: static; }
    .stage { min-height: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="brand">
      <h1>ART OF METHOD — SWEATER MAKER</h1>
      <small>Filipino-inspired custom apparel builder.</small>
    </div>

    <div class="canvasWrap">
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>
    <div class="hint">Drag text to reposition within the safe chest printable area.</div>
  </section>

  <aside class="controls">
    <div class="section">
      <h2>Main Text</h2>
      <label>City / word (Max 15)</label>
      <input id="mainText" type="text" value="MANILA" maxlength="15" />

      <label>Style</label>
      <select id="fontStyle">
        <option value="jeepney">Jeepney display</option>
        <option value="bold">Bold sans</option>
        <option value="classic">Classic serif</option>
      </select>

      <label>Size</label>
      <input id="mainSize" type="range" min="36" max="110" value="84" />

      <label>Text color</label>
      <div class="swatches" id="mainSwatches"></div>

      <label class="checkline"><input id="outlineToggle" type="checkbox" checked /> Outline</label>
    </div>

    <div class="section">
      <h2>Secondary Text</h2>
      <label>Subtitle (Max 15)</label>
      <input id="subText" type="text" value="PHILIPPINES" maxlength="15" />

      <label>Size</label>
      <input id="subSize" type="range" min="18" max="55" value="34" />

      <label>Text color</label>
      <div class="swatches" id="subSwatches"></div>
    </div>

    <div class="section actions">
      <button id="centerBtn" class="btn">Center Design</button>
      <button id="resetBtn" class="btn">Reset</button>
      <button id="exportBtn" class="btn primary">Export PNG</button>
      <div class="tiny">Movement and width are locked to stay strictly on the sweater chest.</div>
    </div>
  </aside>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const sweaterImage = new Image();
sweaterImage.src = 'black-ctft.png';
sweaterImage.onload = () => draw();

document.fonts.ready.then(() => draw());

const inkColors = [
  ['Cream', '#f5ead6'],
  ['White', '#ffffff'],
  ['Gold', '#d4a94f'],
  ['Red', '#b53a32'],
  ['Blue', '#2f5da8'],
  ['Black', '#111111']
];

// Strict bounds locked to the sweater chest
const CHEST_BOUNDS = {
  minX: 420,
  maxX: 660,
  minY: 410,
  maxY: 640,
  maxTextWidth: 460
};

let state = {
  mainText: 'MANILA',
  subText: 'PHILIPPINES',
  fontStyle: 'jeepney',
  mainSize: 84,
  subSize: 34,
  mainColor: '#f5ead6',
  subColor: '#f5ead6',
  outline: true,
  mainPos: { x: 540, y: 480 },
  subPos: { x: 540, y: 550 },
  selected: null
};

function swatches(elId, colors, key) {
  const el = document.getElementById(elId);
  colors.forEach(([name, value]) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (state[key] === value ? ' active' : '');
    b.style.background = value;
    b.title = name;
    b.dataset.value = value;
    b.addEventListener('click', () => {
      state[key] = value;
      [...el.children].forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      draw();
    });
    el.appendChild(b);
  });
}

swatches('mainSwatches', inkColors, 'mainColor');
swatches('subSwatches', inkColors, 'subColor');

function drawGarment() {
  if (!sweaterImage.complete || !sweaterImage.naturalWidth) return;

  // Maximum canvas fill for high visual clarity
  const maxWidth = 1080;
  const maxHeight = 1080;

  const ratio = Math.min(
    maxWidth / sweaterImage.naturalWidth,
    maxHeight / sweaterImage.naturalHeight
  );

  const width = sweaterImage.naturalWidth * ratio;
  const height = sweaterImage.naturalHeight * ratio;

  const x = (canvas.width - width) / 2;
  const y = (canvas.height - height) / 2;

  ctx.drawImage(sweaterImage, x, y, width, height);
}

function fontFor(style, size) {
  if (style === 'jeepney') return `400 ${size}px 'Rye', cursive, serif`;
  if (style === 'classic') return `700 ${size}px Georgia, serif`;
  return `900 ${size}px Arial Black, Arial, sans-serif`;
}

function getFittingFontSize(text, style, initialSize, isMain) {
  let size = initialSize;
  ctx.save();
  while (size > 14) {
    ctx.font = isMain ? fontFor(style, size) : `800 ${size}px Arial, sans-serif`;
    if (ctx.measureText(text).width <= CHEST_BOUNDS.maxTextWidth) break;
    size -= 2;
  }
  ctx.restore();
  return size;
}

function getTextBounds(text, pos, size, isMain) {
  const effectiveSize = getFittingFontSize(text, state.fontStyle, size, isMain);
  ctx.save();
  ctx.font = isMain ? fontFor(state.fontStyle, effectiveSize) : `800 ${effectiveSize}px Arial, sans-serif`;
  const m = ctx.measureText(text);
  ctx.restore();
  const halfW = (m.width + 24) / 2;
  const halfH = (effectiveSize + 18) / 2;
  return {
    left: pos.x - halfW,
    right: pos.x + halfW,
    top: pos.y - halfH,
    bottom: pos.y + halfH,
    width: m.width + 24,
    height: effectiveSize + 18,
    effectiveSize: effectiveSize
  };
}

function drawTextObject(text, pos, size, color, isMain = false) {
  if (!text) return;
  
  const bounds = getTextBounds(text, pos, size, isMain);

  ctx.save();
  ctx.font = isMain ? fontFor(state.fontStyle, bounds.effectiveSize) : `800 ${bounds.effectiveSize}px Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (isMain && state.outline) {
    ctx.lineWidth = Math.max(3, bounds.effectiveSize * 0.08);
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.strokeText(text, pos.x, pos.y);
  }

  ctx.fillStyle = color;
  ctx.fillText(text, pos.x, pos.y);

  if (state.selected === (isMain ? 'main' : 'sub')) {
    ctx.strokeStyle = 'rgba(20, 100, 255, .75)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(pos.x - bounds.width / 2, pos.y - bounds.height / 2, bounds.width, bounds.height);
  }
  ctx.restore();
}

function drawWatermark() {
  ctx.save();
  ctx.font = '700 22px Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(20, 20, 20, .5)';
  ctx.fillText('Made with ART OF METHOD', 1040, 1045);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, 1080, 1080);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 1080, 1080);

  drawGarment();
  drawTextObject(state.mainText, state.mainPos, state.mainSize, state.mainColor, true);
  drawTextObject(state.subText, state.subPos, state.subSize, state.subColor, false);
}

function bind(id, event, fn) {
  document.getElementById(id).addEventListener(event, fn);
}

bind('mainText', 'input', e => { state.mainText = e.target.value.toUpperCase(); draw(); });
bind('subText', 'input', e => { state.subText = e.target.value.toUpperCase(); draw(); });
bind('fontStyle', 'change', e => { state.fontStyle = e.target.value; draw(); });
bind('mainSize', 'input', e => { state.mainSize = +e.target.value; draw(); });
bind('subSize', 'input', e => { state.subSize = +e.target.value; draw(); });
bind('outlineToggle', 'change', e => { state.outline = e.target.checked; draw(); });

function centerDesign() {
  state.mainPos = { x: 540, y: 480 };
  state.subPos = { x: 540, y: 550 };
  draw();
}
bind('centerBtn', 'click', centerDesign);

bind('resetBtn', 'click', () => {
  Object.assign(state, {
    mainText: 'MANILA',
    subText: 'PHILIPPINES',
    fontStyle: 'jeepney',
    mainSize: 84,
    subSize: 34,
    mainColor: '#f5ead6',
    subColor: '#f5ead6',
    outline: true,
    mainPos: { x: 540, y: 480 },
    subPos: { x: 540, y: 550 },
    selected: null
  });

  document.getElementById('mainText').value = 'MANILA';
  document.getElementById('subText').value = 'PHILIPPINES';
  document.getElementById('fontStyle').value = 'jeepney';
  document.getElementById('mainSize').value = 84;
  document.getElementById('subSize').value = 34;
  document.getElementById('outlineToggle').checked = true;

  [...document.getElementById('mainSwatches').children].forEach(x => x.classList.toggle('active', x.dataset.value === state.mainColor));
  [...document.getElementById('subSwatches').children].forEach(x => x.classList.toggle('active', x.dataset.value === state.subColor));
  draw();
});

bind('exportBtn', 'click', () => {
  const prev = state.selected;
  state.selected = null;
  draw();
  drawWatermark();
  const a = document.createElement('a');
  a.download = `art-of-method-${state.mainText.toLowerCase() || 'sweater'}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  state.selected = prev;
  draw();
});

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

let dragging = false, dragKey = null, offset = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', e => {
  const p = pointerPos(e);
  const mainB = getTextBounds(state.mainText, state.mainPos, state.mainSize, true);
  const subB = getTextBounds(state.subText, state.subPos, state.subSize, false);

  if (p.x >= mainB.left && p.x <= mainB.right && p.y >= mainB.top && p.y <= mainB.bottom) {
    dragKey = 'main';
  } else if (p.x >= subB.left && p.x <= subB.right && p.y >= subB.top && p.y <= subB.bottom) {
    dragKey = 'sub';
  } else {
    state.selected = null;
    draw();
    return;
  }

  state.selected = dragKey;
  const pos = dragKey === 'main' ? state.mainPos : state.subPos;
  offset = { x: p.x - pos.x, y: p.y - pos.y };
  dragging = true;
  canvas.setPointerCapture(e.pointerId);
  draw();
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = pointerPos(e);
  const pos = dragKey === 'main' ? state.mainPos : state.subPos;
  
  // Confines drag coordinates strictly within sweater chest boundaries
  pos.x = Math.max(CHEST_BOUNDS.minX, Math.min(CHEST_BOUNDS.maxX, p.x - offset.x));
  pos.y = Math.max(CHEST_BOUNDS.minY, Math.min(CHEST_BOUNDS.maxY, p.y - offset.y));
  draw();
});

canvas.addEventListener('pointerup', e => {
  dragging = false;
  dragKey = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});

draw();
</script>
</body>
</html>
